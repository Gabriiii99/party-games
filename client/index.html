<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: usa tutto lo schermo anche sui telefoni con il notch -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12101c" />
    <meta name="description" content="Giochi di gruppo da fare insieme, ognuno dal proprio telefono." />

    <link rel="icon" href="/icons/favicon.ico" sizes="any" />
    <!-- iOS ignora il manifest per l'icona: la prende solo da qui. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Avviate dalla home, queste due tolgono la barra di Safari e stendono
         l'app sotto la barra di stato. La prima e' il nome standard, la seconda
         quella storica che iOS usa ancora. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Party Games" />

    <title>Party Games</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
